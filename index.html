<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 PRO v4.0 | Dice Analytics</title>
    <style>
        :root { --bg: #080808; --card: #121212; --accent: #00e676; --tai: #00e676; --xiu: #ff5252; --text: #f0f0f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app { width: 100%; max-width: 420px; }
        
        header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        header h1 { font-size: 1rem; letter-spacing: 3px; color: var(--accent); font-weight: 800; }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .main-card { text-align: center; border: 1px solid rgba(0, 230, 118, 0.3); background: linear-gradient(145deg, #121212, #0a0a0a); }
        
        .label { font-size: 0.65rem; text-transform: uppercase; color: #888; letter-spacing: 1.5px; margin-bottom: 5px; }
        .value { font-size: 3.5rem; font-weight: 900; margin: 0; line-height: 1; }
        .tai { color: var(--tai); text-shadow: 0 0 30px rgba(0, 230, 118, 0.4); }
        .xiu { color: var(--xiu); text-shadow: 0 0 30px rgba(255, 82, 82, 0.4); }
        
        .md5-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
        .md5-input { width: 100%; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; color: var(--accent); font-size: 0.75rem; text-align: center; font-family: monospace; outline: none; }
        .md5-input:focus { border-color: var(--accent); }
        
        .dice-display { display: flex; justify-content: center; gap: 12px; margin: 15px 0; }
        .dice { width: 40px; height: 40px; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 2px solid #333; font-size: 1.2rem; color: #fff; }
        
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #1a1a1a; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
        
        .history-list { margin-top: 5px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a1a1a; font-size: 0.75rem; align-items: center; }
        .res-tag { padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 0.7rem; }
        .tag-tai { background: rgba(0, 230, 118, 0.1); color: var(--tai); }
        .tag-xiu { background: rgba(255, 82, 82, 0.1); color: var(--xiu); }
        
        .logic-text { font-size: 0.7rem; color: var(--accent); font-weight: 700; margin-top: 8px; letter-spacing: 1px; }
        .win-indicator { color: #00e676; font-weight: 900; }
        .lose-indicator { color: #ff5252; font-weight: 900; }
    </style>
</head>
<body>
    <div class="app">
        <header><h1>DICE ANALYTICS v4.0</h1></header>

        <div class="card main-card">
            <div class="label">Phiên tiếp theo <span id="nextId">...</span></div>
            <div id="prediction" class="value">...</div>
            <div id="logic" class="logic-text">ĐANG PHÂN TÍCH XÚC XẮC...</div>
            
            <div class="md5-section">
                <div class="label" style="margin-bottom:8px">Nhập mã MD5 phiên mới</div>
                <input type="text" id="md5Input" class="md5-input" placeholder="Dán mã Hash tại đây..." oninput="handleMD5()">
            </div>
        </div>

        <div class="card">
            <div class="label">Kết quả phiên vừa rồi</div>
            <div class="dice-display" id="dices">
                <div class="dice">?</div><div class="dice">?</div><div class="dice">?</div>
            </div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="label">Tin cậy</div>
                    <div class="stat-val" id="conf">0%</div>
                </div>
                <div class="stat-box">
                    <div class="label">Win Rate</div>
                    <div class="stat-val" id="winRate">0%</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="label">Lịch sử phân tích</div>
            <div class="history-list" id="history"></div>
        </div>
    </div>

    <script>
        let manualMode = false;

        async function handleMD5() {
            const val = document.getElementById('md5Input').value;
            if (val.length >= 32) {
                manualMode = true;
                const r = await fetch('/api/predict-md5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ md5: val })
                });
                const d = await r.json();
                renderPrediction(d);
            } else {
                manualMode = false;
            }
        }

        function renderPrediction(data) {
            const p = document.getElementById('prediction');
            const side = data.side || data.next.side;
            p.innerText = side;
            p.className = 'value ' + (side === 'Tài' ? 'tai' : 'xiu');
            document.getElementById('logic').innerText = (data.logic || data.next.logic).toUpperCase();
            document.getElementById('conf').innerText = (data.conf || data.next.conf) + '%';
        }

        async function refresh() {
            if (manualMode) return;
            try {
                const r = await fetch('/api/data');
                const d = await r.json();
                
                document.getElementById('nextId').innerText = d.next.phien;
                renderPrediction(d);
                
                document.getElementById('winRate').innerText = d.stats.winRate + '%';
                const dices = document.getElementById('dices');
                dices.innerHTML = d.current.dices.map(v => `<div class="dice">${v}</div>`).join('');
                
                const hist = document.getElementById('history');
                hist.innerHTML = d.history.map(h => `
                    <div class="history-item">
                        <span style="color:#555">#${h.phien}</span>
                        <span class="res-tag ${h.side === 'Tài' ? 'tag-tai' : 'tag-xiu'}">${h.side}</span>
                        <span style="opacity:0.5">${h.real || '...'}</span>
                        <span class="${h.win ? 'win-indicator' : 'lose-indicator'}">${h.win === null ? '' : (h.win ? '●' : '○')}</span>
                    </div>
                `).join('');
            } catch (e) {}
        }
        setInterval(refresh, 3000);
        refresh();
    </script>
</body>
</html>
